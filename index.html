<!DOCTYPE html>
<html>
    <head>
        <title>Rag System For RealSoft</title>
        <style>
            body { 
                font-family: Arial, sans-serif; 
                margin: 40px auto; 
                background: #121212; 
                color: #fff; 
                max-width: 900px; 
            }
            .header-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            }
            h2 { margin: 0; }
            .user-info { font-size: 0.9rem; color: #aaa; }
            .logout-btn { background: #333; color: #ccc; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 10px; }
            .logout-btn:hover { background: #444; color: #fff; }

            /* Admin Section */
            #adminPanel {
                display: none;
                background: #1e1e1e;
                border: 1px solid #007acc;
                border-radius: 8px;
                padding: 15px;
                margin-bottom: 20px;
            }
            #adminPanel h3 { margin-top: 0; color: #007acc; font-size: 1rem; }
            .admin-actions { display: flex; gap: 15px; align-items: center; }
            
            /* Two-column layout */
            .container {
                display: grid;
                grid-template-columns: 1fr 280px;
                gap: 20px;
            }
            
            .chat-section { display: flex; flex-direction: column; }
            #chat { 
                border: 1px solid #333; 
                height: 380px; 
                padding: 15px; 
                overflow-y: auto; 
                background: #1e1e1e; 
                border-radius: 8px; 
                font-family: monospace; 
                white-space: pre-wrap; 
            }
            .input-group { display: flex; gap: 10px; margin-top: 10px; }
            input[type="text"] { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
            input:disabled { background: #181818; border-color: #333; color: #666; cursor: not-allowed; }
            button { width: 100px; padding: 12px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
            button:hover { background: #005999; }

            #cooldownBanner {
                display: none;
                background: #3a1c1c;
                border: 1px solid #ff4d4d;
                color: #ff9999;
                padding: 10px 15px;
                border-radius: 6px;
                margin-bottom: 10px;
                font-weight: bold;
                font-size: 0.9rem;
            }

            .stats-sidebar { border: 1px solid #333; background: #1e1e1e; border-radius: 8px; padding: 20px; height: 380px; box-sizing: border-box; }
            .stats-sidebar h3 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; color: #007acc; }
            .stat-box { margin-top: 20px; background: #282828; padding: 15px; border-radius: 6px; border-left: 4px solid #007acc; }
            .stat-label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
            .stat-value { font-size: 2rem; font-weight: bold; color: #fff; margin-top: 5px; font-family: monospace; transition: color 0.3s ease; }
            .warning-red { color: #ff4d4d !important; }
        </style>
    </head>
    <body>
        <div class="header-bar">
            <h2>RAG Interactive Stream</h2>
            <div class="user-info">
                User: <strong id="userDisplay">...</strong> (<span id="roleDisplay">...</span>)
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Admin Control Panel (Only visible to Admin) -->
        <div id="adminPanel">
            <h3>Admin Tools: Upload & Rebuild Qdrant Index</h3>
            <div class="admin-actions">
                <input type="file" id="fileUpload" />
                <button onclick="uploadDocument()" style="width: auto;">Upload File</button>
                <button onclick="rebuildVectorStore()" style="width: auto; background: #d9534f;">Rebuild Vector Data</button>
            </div>
            <div id="adminStatus" style="margin-top: 8px; font-size: 0.85rem; color: #aaa;"></div>
        </div>
        
        <div class="container">
            <div class="chat-section">
                <div id="cooldownBanner">⚠️ Rate limit reached! Please wait <span id="timerText">0</span>s before asking again.</div>
                <div id="chat"></div>
                <div class="input-group">
                    <input type="text" id="messageInput" placeholder="Type here..." autofocus autocomplete="off"/>
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>

            <div class="stats-sidebar">
                <h3>Usage Metrics</h3>
                <div class="stat-box">
                    <div class="stat-label">Total Tokens Used</div>
                    <div class="stat-value" id="totalTokens">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Remainder Tokens Left</div>
                    <div class="stat-value" id="remainder">10000</div>
                </div>
            </div>
        </div>

        <script>
            const token = localStorage.getItem("token");
            const username = localStorage.getItem("username");
            const role = localStorage.getItem("role");

            // Auth Check
            if (!token) {
                window.location.href = "/login";
            }

            document.getElementById("userDisplay").innerText = username || "User";
            document.getElementById("roleDisplay").innerText = role || "viewer";

            if (role === "admin") {
                document.getElementById("adminPanel").style.display = "block";
            }

            function logout() {
                localStorage.clear();
                window.location.href = "/login";
            }

            // Connect WebSocket with JWT Token
            const ws = new WebSocket(`ws://${window.location.host}/ws/chat?token=${token}`);
            const chat = document.getElementById("chat");
            const input = document.getElementById("messageInput");
            const sendBtn = document.getElementById("sendBtn");
            const cooldownBanner = document.getElementById("cooldownBanner");
            const timerText = document.getElementById("timerText");
            
            ws.onclose = function(e) {
                chat.innerText += `\n[CONNECTION CLOSED] code=${e.code}. Refresh the page (or log in again).\n`;
                input.disabled = true;
                sendBtn.disabled = true;
            };
            ws.onerror = function() {
                chat.innerText += "\n[CONNECTION ERROR]\n";
            };

            let totalTokenCount = 0;
            let cooldownInterval = null;
            let answerStartText = "";   // chat content before the current streamed answer (for ANSWER_RESET)

            ws.onmessage = function(event) {
                const message = event.data;

                if (message.startsWith("METADATA:")) {
                    const data = JSON.parse(message.replace("METADATA:", ""));
                    if (data.tokens) updateTokenStats(data.tokens);
                    return;
                }

                if (message.startsWith("RATE_LIMIT:")) {
                    const data = JSON.parse(message.replace("RATE_LIMIT:", ""));
                    startCooldownTimer(data.retry_after);
                    return;
                }

                // Streaming control messages
                if (message === "ANSWER_START:") { answerStartText = chat.textContent; return; }
                if (message === "ANSWER_RESET:") { chat.textContent = answerStartText; return; }  // discard a bad partial answer
                if (message === "ANSWER_END:") { return; }

                chat.append(message);   // a streamed token (append is cheap; no re-layout of the whole chat)
                chat.scrollTop = chat.scrollHeight;
            };

            function updateTokenStats(count) {
                totalTokenCount += count;
                const remaining = 10000 - totalTokenCount;

                const remainderEl = document.getElementById("remainder");
                document.getElementById("totalTokens").innerText = totalTokenCount;
                remainderEl.innerText = remaining;

                if (remaining <= 0) {
                    remainderEl.classList.add("warning-red");
                    sendBtn.style.display = "none";
                    input.disabled = true;
                    input.placeholder = "Token limit reached.";
                } else if (remaining <= 500) {
                    remainderEl.classList.add("warning-red");
                }
            }

            function startCooldownTimer(seconds) {
                input.disabled = true;
                sendBtn.disabled = true;
                cooldownBanner.style.display = "block";
                
                let remainingTime = seconds;
                timerText.innerText = remainingTime;

                if (cooldownInterval) clearInterval(cooldownInterval);

                cooldownInterval = setInterval(() => {
                    remainingTime -= 1;
                    timerText.innerText = remainingTime;

                    if (remainingTime <= 0) {
                        clearInterval(cooldownInterval);
                        cooldownBanner.style.display = "none";
                        input.disabled = false;
                        sendBtn.disabled = false;
                        input.focus();
                    }
                }, 1000);
            }

            function sendMessage() {
                if (!input.value.trim() || input.disabled) return;
                if (ws.readyState !== WebSocket.OPEN) { chat.innerText += "\n[Not connected]\n"; return; }
                ws.send(input.value);
                input.value = "";
            }

            input.addEventListener("keypress", function(e) {
                if (e.key === "Enter") sendMessage();
            });

            // Admin Actions
            async function uploadDocument() {
                const fileInput = document.getElementById("fileUpload");
                const status = document.getElementById("adminStatus");
                if (!fileInput.files[0]) return alert("Select a file first!");

                const formData = new FormData();
                formData.append("file", fileInput.files[0]);

                status.innerText = "Uploading file...";
                const res = await fetch("/admin/upload", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` },
                    body: formData
                });

                const data = await res.json();
                status.innerText = data.message || data.detail;
            }

            async function rebuildVectorStore() {
                const status = document.getElementById("adminStatus");
                if (!confirm("Are you sure you want to rebuild the vector store?")) return;

                status.innerText = "Rebuilding Qdrant vector store...";
                const res = await fetch("/admin/rebuild", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const data = await res.json();
                status.innerText = data.message || data.detail;
            }
        </script>
    </body>
</html>
